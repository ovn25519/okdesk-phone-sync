# Пример конфигурации сервиса okdesk-phone-sync.
#
# Скопируйте файл в config.toml и заполните значения. config.toml содержит
# секрет (api_token) и права 0600 — не добавляйте его в контроль версий.

[okdesk]
# Базовый URL аккаунта Okdesk без завершающего «/».
base_url = "https://example.okdesk.ru"
# Токен API Okdesk (настройки аккаунта → API). Обязательное поле.
api_token = "<API_TOKEN>"
# Машинный код дополнительного атрибута заявки, в который записывается телефон
# контакта. Код задаётся вами при создании атрибута в интерфейсе Okdesk
# (Настройки → Дополнительные атрибуты заявок, тип «Строка»).
phone_attr_code = "<ATTR_CODE>"
# Статусы заявок, которые считаются открытыми и подлежат обработке.
status_codes = ["opened", "inprogress", "delayed"]
# Порядок выбора телефона контакта: используется первое непустое поле.
# Допустимые значения: mobile_phone, phone.
phone_priority = ["mobile_phone", "phone"]
# Таймаут одного HTTP-запроса к Okdesk, секунды.
http_timeout_seconds = 30
# Проверять на старте, что phone_attr_code присутствует в схеме атрибутов
# заявок. Защищает от опечатки в коде и от не созданного поля.
verify_attr = true

[sync]
# Период между проходами демона, минуты.
poll_interval_minutes = 5
# Размер страницы при постраничном чтении заявок (1..50).
page_size = 50
# Пауза между последовательными запросами к Okdesk, миллисекунды.
request_delay_ms = 200
# Число повторных попыток при сетевой ошибке или ответе 5xx.
max_retries = 3
# Задержка перед первой повторной попыткой, секунды.
initial_backoff_seconds = 2
# Верхняя граница экспоненциальной задержки повторов, секунды.
max_backoff_seconds = 60
# Режим примерки: заявки и телефоны находятся, но в Okdesk ничего не пишется.
dry_run = false
# Искать телефон в описании заявки, если у контакта его нет. По умолчанию
# выключено: включайте осознанно, т.к. в тексте возможны посторонние числа.
# Найденный номер нормализуется к виду +7XXXXXXXXXX и записывается только в
# поле заявки.
search_in_description = false

[log]
# Уровень логирования: debug, info, warn или error.
level = "info"
